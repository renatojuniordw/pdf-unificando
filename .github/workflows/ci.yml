name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, tipos, testes e auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Testes unitários e de integração
        run: npm run test

      - name: Auditoria de dependências (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build