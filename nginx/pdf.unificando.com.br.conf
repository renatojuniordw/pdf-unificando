server {
    listen 80;
    server_name pdf.unificando.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdf.unificando.com.br;

    ssl_certificate     /etc/letsencrypt/live/pdf.unificando.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.unificando.com.br/privkey.pem;

    # Alinhado com MAX_FILE_SIZE + margem para headers
    client_max_body_size 55M;

    # Headers de segurança (defesa em profundidade além do Next.js)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass         http://unificando-pdf:11005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout generoso para LibreOffice e Ghostscript
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Rate limiting na camada do Nginx para rotas de upload
    # Requer: include nginx/http-context.conf no bloco http {} do nginx.conf principal
    location /api/pdf/ {
        limit_req zone=pdf_upload burst=3 nodelay;

        proxy_pass         http://unificando-pdf:11005;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
