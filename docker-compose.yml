
services:
  pdf-tools:
    build: .
    container_name: unificando-pdf
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MAX_FILE_SIZE: "52428800"
      MAX_CONCURRENT_JOBS: "2"
      MAX_QUEUE_SIZE: "5"
      RETRY_AFTER_SECONDS: "30"
      NEXT_PUBLIC_GA_ID: "${NEXT_PUBLIC_GA_ID}"
      GA_API_SECRET: "${GA_API_SECRET}"
      NEXT_PUBLIC_ADSENSE_ID: "${NEXT_PUBLIC_ADSENSE_ID}"
      PORT: "11005"
    ports:
      - "127.0.0.1:11005:11005"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
      - /home/appuser/.cache:size=64m,mode=1777
      - /home/appuser/.fontconfig:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
